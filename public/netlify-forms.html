<!DOCTYPE html>
<!--
  Netlify Forms detection stub.
  This file is never served to users — it exists only so Netlify's deploy bot
  can scan and register the forms defined below. The actual forms live in the
  Next.js app (history/page.tsx) and submit with matching form-name values.
-->
<html lang="en">
<head><meta charset="utf-8" /><title>Netlify Forms</title></head>
<body>

  <!-- history-stories form (src/app/history/page.tsx) -->
  <form name="history-stories" data-netlify="true" netlify-honeypot="bot-field" action="/thanks/" method="POST" hidden>
    <input type="hidden" name="form-name" value="history-stories" />
    <input type="hidden" name="bot-field" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <textarea name="story"></textarea>
  </form>

</body>
</html>
